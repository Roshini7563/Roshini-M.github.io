<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Form</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .box {
            width: 500px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            background: #4285f4;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Submit URL</h2>

    <form
        action="https://formspree.io/f/xnpnajpe"
        method="POST">

        <input
            type="url"
            name="submitted_url"
            value="https://example.com"
            required>

        <button type="submit">
            Submit
        </button>

    </form>

</div>

</body>
</html>
